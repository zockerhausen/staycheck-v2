name: Reiseführer-Texte auswerten (Wikivoyage + KI)
# Eine kleine KI (Claude Haiku) liest NUR die Wikivoyage-Texte zu jeder Stadt und macht daraus Werte je Gegend,
# jeweils mit wörtlichem Zitat, das geprüft wird. Ergebnis: data/insights/<stadt>.json (siehe scripts/guide/texts.py).
# Braucht das Repository-Secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Ohne Schlüssel passiert nichts.
on:
  schedule:
    - cron: "23 4 6 1,4,7,10 *" # alle 3 Monate
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Städte (Komma-Liste von Slugs, leer = alle)"
        required: false
        default: ""
      max_usd:
        description: "Kostenlimit für diesen Lauf in US-Dollar"
        required: false
        default: "3"
      dry_run:
        description: "Nur Texte sammeln und Kosten schätzen (1 = ja)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: webwissen
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Texte auswerten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUR: ${{ inputs.nur }}
          MAX_USD: ${{ inputs.max_usd || '3' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python3 scripts/guide/texts.py
      - name: Speichern
        if: always()
        run: |
          git config user.name "zockerhausen"
          git config user.email "pauljonas.beth@me.com"
          git add data/insights 2>/dev/null || true
          git diff --cached --quiet && echo "Nichts Neues" && exit 0
          MSG="Reiseführer-Texte ausgewertet (Wikivoyage + KI)"
          git commit -q -m "$MSG" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NHFJiDqfkhiYUvj1E1dwBL"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          # Dieselben Daten auch auf den jeweils anderen Zweig (nur der Ordner data/insights)
          NEW=$(git rev-parse HEAD)
          OTHER=$([ "${GITHUB_REF_NAME}" = "main" ] && echo design-dunkel || echo main)
          if git fetch -q origin "$OTHER"; then
            git checkout -q -B other FETCH_HEAD
            git checkout -q "$NEW" -- data/insights
            git add data/insights
            git diff --cached --quiet || git commit -q -m "$MSG" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NHFJiDqfkhiYUvj1E1dwBL"
            git push -q origin "other:$OTHER" || echo "::warning::$OTHER nicht aktualisiert"
          fi
