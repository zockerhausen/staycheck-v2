name: probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-dunkel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p data/insights
          for f in data/cities/wien.json.gz data/cities/berlin.json.gz data/cities/bangkok.json.gz; do
            slug=$(basename "$f" .json.gz)
            python3 scripts/guide/wikivoyage.py "$f" "data/insights/$slug.guide.json.gz" || echo "::warning title=$slug::Wikivoyage übersprungen"
          done
          git config user.name "zockerhausen"; git config user.email "pauljonas.beth@me.com"
          git add data/insights
          git commit -qm "Reiseführer-Wissen aktualisiert (Wikivoyage)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NHFJiDqfkhiYUvj1E1dwBL"
          git pull --rebase -q origin design-dunkel
          git push -q origin HEAD:design-dunkel
