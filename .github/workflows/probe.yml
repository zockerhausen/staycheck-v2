name: probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-dunkel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p /tmp/out
          for s in chiang-mai berlin bangkok lissabon; do python3 scripts/guide/wikivoyage.py data/cities/$s.json.gz /tmp/out/$s.guide.json; done
          git config user.name "zockerhausen"; git config user.email "pauljonas.beth@me.com"
          git checkout -q --orphan probe-guide-data && git rm -rq --cached . && rm -rf ./* && cp /tmp/out/*.json . && git add *.json && git commit -qm "probe data" && git push -q -f origin probe-guide-data
