name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-dunkel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p out
          for s in chiang-mai berlin bangkok lissabon; do python3 scripts/guide/wikivoyage.py data/cities/$s.json.gz out/$s.guide.json; done
      - uses: actions/upload-artifact@v4
        with:
          name: guide
          path: out/
