name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="StayCheck/1.0 (https://github.com/zockerhausen/staycheck-v2)"
          for L in de en; do
            echo "== $L geosearch"; curl -sS -A "$UA" "https://$L.wikivoyage.org/w/api.php?format=json&formatversion=2&action=query&list=geosearch&gscoord=38.7114%7C-9.13&gsradius=4000&gslimit=30" | head -c 1500; echo
          done
          echo "== de extract"; curl -sS -A "$UA" "https://de.wikivoyage.org/w/api.php?format=json&formatversion=2&action=query&prop=extracts&exintro=1&explaintext=1&titles=Lissabon/Alfama&redirects=1" | head -c 800; echo
          echo "== en extract"; curl -sS -A "$UA" "https://en.wikivoyage.org/w/api.php?format=json&formatversion=2&action=query&prop=extracts&exintro=1&explaintext=1&titles=Lisbon/Alfama&redirects=1" | head -c 800; echo
